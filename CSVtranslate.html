<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 跨語系全量翻譯工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50/50 text-slate-900 min-h-screen antialiased flex flex-col">

    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                </div>
                <div>
                    <h1 class="text-sm font-semibold text-slate-900 leading-none">CSV 跨語系全量翻譯工具</h1>
                </div>
            </div>
            <div class="text-xs text-slate-400 font-mono">
                UTF-8 / Big5 自動識別
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-4 sm:px-6 py-8 flex-1 space-y-6">

        <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm p-6 space-y-6">
            
            <div>
                <input type="file" id="csvFileInput" class="hidden" accept=".csv,.txt,text/csv,text/plain,*" />
                
                <label for="csvFileInput" id="dropZone" class="block border-2 border-dashed border-slate-300 hover:border-slate-500 bg-slate-50/60 hover:bg-slate-50 rounded-xl p-8 text-center cursor-pointer transition-all">
                    <div class="flex flex-col items-center justify-center space-y-3 pointer-events-none">
                        <div class="w-12 h-12 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 shadow-sm">
                            <i data-lucide="upload-cloud" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <span class="inline-block px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-medium mb-1.5">點擊此處選取 CSV 檔案</span>
                            <p class="text-xs text-slate-600 font-medium">或 直接拖曳檔案至此區域</p>
                        </div>
                        <p class="text-[11px] text-slate-400">已啟用 Big5 (ANSI) / UTF-8 自動編碼偵測，徹底防亂碼</p>
                    </div>
                </label>

                <div id="fileInfoCard" class="hidden mt-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 truncate">
                        <i data-lucide="file-check-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>
                        <span id="fileName" class="text-xs font-semibold text-slate-800 truncate">data.csv</span>
                        <span id="encodingTag" class="px-2 py-0.5 rounded text-[10px] bg-slate-200 text-slate-800 font-mono font-medium shrink-0">UTF-8</span>
                        <span id="fileTypeTag" class="hidden px-2 py-0.5 rounded text-[10px] bg-indigo-100 text-indigo-800 font-medium shrink-0">人機警報檔 (鎖定前4列)</span>
                        <span id="fileMeta" class="text-[11px] text-slate-400 font-mono shrink-0">0 KB • 0 行</span>
                    </div>
                    <button type="button" id="btnRemoveFile" class="text-slate-400 hover:text-rose-600 p-1 rounded transition-colors" title="重新選取">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-4">
                    <label id="lblKeepHeader" class="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer select-none">
                        <input type="checkbox" id="chkKeepHeader" checked class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-0 cursor-pointer" />
                        <span id="txtKeepHeader">保留第 1 列表頭</span>
                    </label>

                    <label class="flex items-center space-x-2 text-xs text-slate-700 font-medium cursor-pointer select-none">
                        <input type="checkbox" id="chkConciseMode" checked class="w-4 h-4 rounded border-slate-300 text-slate-900 focus:ring-0 cursor-pointer" />
                        <span>簡短名詞模式（過濾括號與贅字）</span>
                    </label>
                </div>

                <div class="flex items-center space-x-2 text-xs">
                    <span class="text-slate-500 font-medium">D 欄目標語言：</span>
                    <select id="selectTargetLang" class="bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-slate-400 cursor-pointer font-medium">
                        <option value="zh-CN">簡體中文 (離線秒轉)</option>
                        <option value="ja">日文 (Japanese)</option>
                        <option value="tl">菲律賓文 (Tagalog)</option>
                        <option value="vi">越南文 (Vietnamese)</option>
                    </select>
                </div>
            </div>

            <button id="btnStart" disabled class="w-full py-3 px-4 rounded-lg text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed transition-all flex items-center justify-center space-x-2 shadow-sm">
                <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                <span>開始轉換與翻譯</span>
            </button>
        </div>

        <div id="processingSection" class="hidden bg-white rounded-xl border border-slate-200/80 p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2">
                    <i data-lucide="loader-2" class="w-3.5 h-3.5 text-slate-600 animate-spin"></i>
                    <span id="statusText" class="font-medium text-slate-700">正在處理中...</span>
                </div>
                <span id="progressPercent" class="font-mono font-semibold text-slate-900">0%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                <div id="progressBar" class="bg-slate-900 h-full w-0 transition-all duration-150"></div>
            </div>
            <div class="flex items-center justify-between text-[11px] text-slate-400 font-mono pt-1">
                <span>總筆數: <strong id="statTotalRows" class="text-slate-600">0</strong></span>
                <span>全量處理: <strong id="statTranslatedRows" class="text-slate-600">0</strong></span>
                <span>耗時: <strong id="statElapsedTime" class="text-slate-600">0.0s</strong></span>
            </div>
        </div>

        <div id="resultSection" class="hidden bg-white rounded-xl border border-slate-200/80 shadow-sm overflow-hidden">
            <div class="px-5 py-3.5 border-b border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50/40">
                <div class="text-xs font-semibold text-slate-800 flex items-center">
                    <i data-lucide="check" class="w-4 h-4 mr-1.5 text-slate-900"></i> 轉換完成 (預覽前 50 筆)
                </div>
                <div class="flex items-center space-x-2">
                    <button type="button" id="btnRescueModal" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium text-xs transition-colors flex items-center">
                        <i data-lucide="copy" class="w-3.5 h-3.5 mr-1 text-slate-500"></i> 複製/救援
                    </button>
                    <button type="button" id="btnDownload" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs transition-colors flex items-center shadow-sm">
                        <i data-lucide="download" class="w-3.5 h-3.5 mr-1"></i> 下載 CSV
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto max-h-[460px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50/90 text-slate-500 font-medium sticky top-0 z-10 border-b border-slate-200">
                        <tr id="tableHeaderRow"></tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 font-mono text-[11px] text-slate-700"></tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="rescueModal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full p-5 shadow-xl border border-slate-200 flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="text-xs font-semibold text-slate-900">CSV 內容救援導出</h3>
                <button type="button" id="btnCloseModal" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="py-3 flex-1 flex flex-col">
                <textarea id="rescueTextarea" readonly class="w-full flex-1 p-3 bg-slate-50 text-slate-800 font-mono text-[11px] rounded-lg border border-slate-200 focus:outline-none resize-none leading-relaxed"></textarea>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
                <button type="button" id="btnOpenNewTab" class="px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-medium transition-colors">
                    新分頁開啟
                </button>
                <button type="button" id="btnCopyCSV" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium transition-colors">
                    一鍵複製全部內容
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let rawCSVRows = [];
        let processedCSVRows = [];
        let currentFile = null;
        let isHmiAlarmFile = false;
        const translationCache = new Map();

        const dropZone = document.getElementById('dropZone');
        const csvFileInput = document.getElementById('csvFileInput');
        const fileInfoCard = document.getElementById('fileInfoCard');
        const fileName = document.getElementById('fileName');
        const fileTypeTag = document.getElementById('fileTypeTag');
        const encodingTag = document.getElementById('encodingTag');
        const fileMeta = document.getElementById('fileMeta');
        const btnRemoveFile = document.getElementById('btnRemoveFile');
        const btnStart = document.getElementById('btnStart');
        const btnDownload = document.getElementById('btnDownload');
        const btnRescueModal = document.getElementById('btnRescueModal');
        const selectTargetLang = document.getElementById('selectTargetLang');
        const chkConciseMode = document.getElementById('chkConciseMode');
        const chkKeepHeader = document.getElementById('chkKeepHeader');
        const txtKeepHeader = document.getElementById('txtKeepHeader');

        const processingSection = document.getElementById('processingSection');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const progressBar = document.getElementById('progressBar');

        const statTotalRows = document.getElementById('statTotalRows');
        const statTranslatedRows = document.getElementById('statTranslatedRows');
        const statElapsedTime = document.getElementById('statElapsedTime');

        const resultSection = document.getElementById('resultSection');
        const tableHeaderRow = document.getElementById('tableHeaderRow');
        const tableBody = document.getElementById('tableBody');

        const rescueModal = document.getElementById('rescueModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const rescueTextarea = document.getElementById('rescueTextarea');
        const btnCopyCSV = document.getElementById('btnCopyCSV');
        const btnOpenNewTab = document.getElementById('btnOpenNewTab');

        const langNameMap = {
            'zh-CN': '簡體中文',
            'ja': '日文',
            'tl': '菲律賓文',
            'vi': '越南文'
        };

        // --- 全域拖曳防護 (防止瀏覽器直接開啟檔案) ---
        window.addEventListener('dragover', (e) => e.preventDefault(), false);
        window.addEventListener('drop', (e) => e.preventDefault(), false);

        // 拖曳視覺反饋
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-slate-600', 'bg-slate-100');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-slate-600', 'bg-slate-100');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-slate-600', 'bg-slate-100');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        // 點擊檔案選取
        csvFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        btnRemoveFile.addEventListener('click', (e) => {
            e.stopPropagation();
            resetFileInput();
        });

        function resetFileInput() {
            currentFile = null;
            rawCSVRows = [];
            processedCSVRows = [];
            isHmiAlarmFile = false;
            csvFileInput.value = '';
            fileInfoCard.classList.add('hidden');
            fileTypeTag.classList.add('hidden');
            dropZone.classList.remove('hidden');
            btnStart.disabled = true;
            resultSection.classList.add('hidden');
            processingSection.classList.add('hidden');
            txtKeepHeader.textContent = "保留第 1 列表頭";
        }

        // --- 方案 C：底層二進位自動辨識編碼 (UTF-8 / Big5 / UTF-16) ---
        function readFileWithAutoEncoding(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const buffer = e.target.result;
                    const uint8 = new Uint8Array(buffer);

                    // 1. 檢查 BOM
                    if (uint8.length >= 3 && uint8[0] === 0xEF && uint8[1] === 0xBB && uint8[2] === 0xBF) {
                        return resolve({ text: new TextDecoder('utf-8').decode(uint8.subarray(3)), encoding: 'UTF-8 (BOM)' });
                    }
                    if (uint8.length >= 2 && uint8[0] === 0xFF && uint8[1] === 0xFE) {
                        return resolve({ text: new TextDecoder('utf-16le').decode(uint8.subarray(2)), encoding: 'UTF-16LE' });
                    }

                    // 2. 嘗試嚴格 UTF-8
                    try {
                        const text = new TextDecoder('utf-8', { fatal: true }).decode(uint8);
                        return resolve({ text, encoding: 'UTF-8' });
                    } catch (err) {
                        // UTF-8 失敗，切換為 Big5 (ANSI)
                    }

                    // 3. 嘗試 Big5 (繁體 Windows / 三菱人機預設)
                    try {
                        const text = new TextDecoder('big5').decode(uint8);
                        return resolve({ text, encoding: 'Big5 (ANSI)' });
                    } catch (err2) {
                        // 降級容錯
                        const text = new TextDecoder('utf-8').decode(uint8);
                        return resolve({ text, encoding: 'UTF-8 (容錯)' });
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function handleFileSelect(file) {
            currentFile = file;
            fileName.textContent = file.name;
            fileMeta.textContent = `${(file.size / 1024).toFixed(1)} KB • 解析中...`;

            dropZone.classList.add('hidden');
            fileInfoCard.classList.remove('hidden');

            try {
                // 自動辨識編碼解碼文字
                const { text, encoding } = await readFileWithAutoEncoding(file);
                encodingTag.textContent = encoding;

                // PapaParse 解析
                Papa.parse(text, {
                    skipEmptyLines: 'greedy',
                    complete: function(results) {
                        rawCSVRows = results.data || [];
                        
                        // 偵測是否為三菱人機警報檔簽章 [File Format]
                        isHmiAlarmFile = false;
                        if (rawCSVRows.length > 0 && rawCSVRows[0][0] && String(rawCSVRows[0][0]).includes('[File Format]')) {
                            isHmiAlarmFile = true;
                        }

                        if (isHmiAlarmFile) {
                            fileTypeTag.classList.remove('hidden');
                            txtKeepHeader.textContent = "已鎖定人機前 4 列表頭";
                        } else {
                            fileTypeTag.classList.add('hidden');
                            txtKeepHeader.textContent = "保留第 1 列表頭";
                        }

                        fileMeta.textContent = `${(file.size / 1024).toFixed(1)} KB • 共 ${rawCSVRows.length} 行`;
                        btnStart.disabled = rawCSVRows.length === 0;
                        showToast(`已成功載入 ${rawCSVRows.length} 行資料 (${encoding})`);
                    },
                    error: function(err) {
                        showToast('CSV 解析失敗：' + err.message);
                        resetFileInput();
                    }
                });
            } catch (err) {
                showToast('讀取檔案失敗：' + err.message);
                resetFileInput();
            }
        }

        function isBlankOrInvisible(str) {
            if (str === null || str === undefined) return true;
            const cleaned = String(str).replace(/[\s\u3000\u00A0\uFEFF\u2000-\u200B\r\n\t]/g, '');
            return cleaned.length === 0;
        }

        // 提取警報代號前綴 (如 F0001:)
        function extractAlarmPrefix(text) {
            if (!text) return { prefix: '', content: '' };
            const str = String(text).trim();
            const match = str.match(/^([A-Za-z0-9_\-\.]+:\s*)(.*)$/);
            if (match) {
                return { prefix: match[1], content: match[2] };
            }
            return { prefix: '', content: str };
        }

        function preprocessText(text, isConcise) {
            if (!text) return '';
            let str = String(text).trim();
            if (isConcise) {
                str = str.replace(/[\(（\[【〔<＜][^\)）\]】〕>＞]*[\)）\]】〕>＞]/g, ' ');
                str = str.replace(/[、，,;；/\\_|\-]+/g, ' ').replace(/\s+/g, ' ').trim();
            }
            return str || String(text).trim();
        }

        function postprocessText(text, targetLang, isConcise) {
            if (!text) return '';
            let str = String(text).trim();
            str = str.replace(/[\.\,\;\:\!\?。，；：！？]+$/g, '').trim();

            if (isConcise) {
                if (targetLang === 'en') {
                    str = str.replace(/^(the|a|an)\s+/i, '');
                    str = str.replace(/\s+(etc|and so on|is included|are included)$/i, '');
                    str = str.replace(/\s+/g, ' ').trim();
                } else if (targetLang === 'ja') {
                    str = str.replace(/(のこと|である|です|ます)$/g, '');
                }
            }
            return str;
        }

        async function fetchWithTimeout(url, timeoutMs = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        async function translateBatchText(textList, targetLang = 'en', isConcise = true) {
            if (!textList || textList.length === 0) return [];
            
            const results = new Array(textList.length).fill(null);
            const uncachedIndices = [];
            const uncachedTexts = [];

            textList.forEach((text, idx) => {
                const query = preprocessText(text, isConcise);
                const cacheKey = `${targetLang}:${isConcise ? 'c' : 'f'}:${query}`;

                if (translationCache.has(cacheKey)) {
                    results[idx] = translationCache.get(cacheKey);
                } else {
                    uncachedIndices.push(idx);
                    uncachedTexts.push(query);
                }
            });

            if (uncachedTexts.length === 0) {
                return results;
            }

            const joinedText = uncachedTexts.join('\n');
            let batchSuccess = false;

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(joinedText)}`;
                const res = await fetchWithTimeout(url, 6000);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data[0] && Array.isArray(data[0])) {
                        const fullOutput = data[0].map(item => item[0]).join('');
                        const translatedLines = fullOutput.split('\n').map(l => l.trim());
                        
                        if (translatedLines.length === uncachedTexts.length) {
                            uncachedTexts.forEach((query, i) => {
                                const cleanTrans = postprocessText(translatedLines[i], targetLang, isConcise);
                                translationCache.set(`${targetLang}:${isConcise ? 'c' : 'f'}:${query}`, cleanTrans);
                                results[uncachedIndices[i]] = cleanTrans;
                            });
                            batchSuccess = true;
                        }
                    }
                }
            } catch (e) {}

            if (!batchSuccess) {
                for (let i = 0; i < uncachedTexts.length; i++) {
                    const query = uncachedTexts[i];
                    const singleRes = await translateSingleRobust(query, targetLang, isConcise);
                    if (singleRes) {
                        results[uncachedIndices[i]] = singleRes;
                    }
                    await new Promise(r => setTimeout(r, 40));
                }
            }

            return results;
        }

        async function translateSingleRobust(text, targetLang = 'en', isConcise = true) {
            if (!text || isBlankOrInvisible(text)) return '';
            const query = preprocessText(text, isConcise);
            const cacheKey = `${targetLang}:${isConcise ? 'c' : 'f'}:${query}`;

            if (translationCache.has(cacheKey)) {
                return translationCache.get(cacheKey);
            }

            let result = '';

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(query)}`;
                const res = await fetchWithTimeout(url, 3500);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data[0] && Array.isArray(data[0])) {
                        const r = data[0].map(item => item[0]).filter(Boolean).join('');
                        if (r) result = r.trim();
                    }
                }
            } catch (e) {}

            if (!result) {
                try {
                    const url = `https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=${targetLang}&q=${encodeURIComponent(query)}`;
                    const res = await fetchWithTimeout(url, 3500);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data[0]) {
                            const r = Array.isArray(data[0]) ? data[0].join('') : String(data[0]);
                            if (r) result = r.trim();
                        } else if (typeof data === 'string' && data) {
                            result = data.trim();
                        }
                    }
                } catch (e) {}
            }

            if (!result) {
                try {
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(query)}&langpair=zh-TW|${targetLang}`;
                    const res = await fetchWithTimeout(url, 4000);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.responseData && data.responseData.translatedText) {
                            const txt = data.responseData.translatedText;
                            if (!txt.includes('MYMEMORY WARNING') && !txt.includes('QUERY LENGTH LIMIT')) {
                                result = txt.trim();
                            }
                        }
                    }
                } catch (e) {}
            }

            if (result) {
                const cleanResult = postprocessText(result, targetLang, isConcise);
                translationCache.set(cacheKey, cleanResult);
                return cleanResult;
            }

            return '';
        }

        function getOpenCCConverter() {
            if (typeof OpenCC === 'undefined' || !OpenCC.Converter) {
                return (text) => text;
            }
            try {
                return OpenCC.Converter({ from: 'tw', to: 'cn' });
            } catch (e) {
                return (text) => text;
            }
        }

        // --- 點擊開始翻譯 ---
        btnStart.addEventListener('click', async () => {
            if (!rawCSVRows || rawCSVRows.length === 0) return;

            const keepHeader = chkKeepHeader.checked;
            const isConcise = chkConciseMode.checked;
            const targetLangD = selectTargetLang.value;
            const targetLangDName = langNameMap[targetLangD] || '簡體中文';

            btnStart.disabled = true;
            processingSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            processingSection.scrollIntoView({ behavior: 'smooth' });

            processedCSVRows = rawCSVRows.map(row => [...row]);
            const opencc = getOpenCCConverter();

            let startIndex = 0;
            if (isHmiAlarmFile) {
                startIndex = 4; // 凍結人機前 4 列表頭
            } else if (keepHeader) {
                startIndex = 1;
            }

            const totalRows = processedCSVRows.length;

            if (!isHmiAlarmFile && keepHeader && totalRows > 0) {
                while (processedCSVRows[0].length < 4) processedCSVRows[0].push('');
                if (isBlankOrInvisible(processedCSVRows[0][2])) processedCSVRows[0][2] = 'English';
                if (isBlankOrInvisible(processedCSVRows[0][3])) processedCSVRows[0][3] = targetLangDName;
            }

            const taskList = [];
            for (let i = startIndex; i < totalRows; i++) {
                const row = processedCSVRows[i];
                while (row.length < 4) row.push('');

                const colB = row[1] || '';
                if (colB && !isBlankOrInvisible(colB)) {
                    const { prefix, content } = isHmiAlarmFile ? extractAlarmPrefix(colB) : { prefix: '', content: colB };
                    taskList.push({ rowIndex: i, rawText: colB, prefix, content });
                }
            }

            const startTime = performance.now();
            const totalTasks = taskList.length;
            statTotalRows.textContent = totalRows;
            statTranslatedRows.textContent = totalTasks;

            const timerInterval = setInterval(() => {
                const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(1);
                statElapsedTime.textContent = `${elapsedSec}s`;
            }, 100);

            // D 欄簡體中文 (離線秒級對譯)
            if (targetLangD === 'zh-CN') {
                for (let i = 0; i < taskList.length; i++) {
                    const task = taskList[i];
                    if (isHmiAlarmFile) {
                        const pre = preprocessText(task.content, isConcise);
                        const conv = postprocessText(opencc(pre), 'zh-CN', isConcise);
                        processedCSVRows[task.rowIndex][3] = task.prefix ? `${task.prefix}${conv}` : conv;
                    } else {
                        const pre = preprocessText(task.rawText, isConcise);
                        processedCSVRows[task.rowIndex][3] = postprocessText(opencc(pre), 'zh-CN', isConcise);
                    }
                }
            }

            statusText.textContent = `正在批次翻譯中 (C欄: 英文 / D欄: ${targetLangDName})...`;
            const BATCH_SIZE = 20;

            for (let i = 0; i < taskList.length; i += BATCH_SIZE) {
                const batch = taskList.slice(i, i + BATCH_SIZE);
                const queryTexts = batch.map(item => isHmiAlarmFile ? item.content : item.rawText);

                // 1. C 欄英譯
                const enPromise = translateBatchText(queryTexts, 'en', isConcise);

                // 2. D 欄 (非簡中)
                let dPromise = null;
                if (targetLangD !== 'zh-CN') {
                    dPromise = translateBatchText(queryTexts, targetLangD, isConcise);
                }

                try {
                    const [enResults, dResults] = await Promise.all([enPromise, dPromise]);
                    
                    batch.forEach((task, idx) => {
                        if (enResults && enResults[idx]) {
                            const resEn = enResults[idx];
                            processedCSVRows[task.rowIndex][2] = task.prefix ? `${task.prefix}${resEn}` : resEn;
                        }
                        if (dResults && dResults[idx]) {
                            const resD = dResults[idx];
                            processedCSVRows[task.rowIndex][3] = task.prefix ? `${task.prefix}${resD}` : resD;
                        }
                    });
                } catch (e) {}

                const progress = Math.min(85, Math.round(((i + batch.length) / (totalTasks || 1)) * 85));
                progressPercent.textContent = `${progress}%`;
                progressBar.style.width = `${progress}%`;
                await new Promise(r => setTimeout(r, 70));
            }

            // 補漏校驗
            statusText.textContent = "補漏校驗中...";
            for (let i = 0; i < taskList.length; i++) {
                const task = taskList[i];
                const query = isHmiAlarmFile ? task.content : task.rawText;

                if (isBlankOrInvisible(processedCSVRows[task.rowIndex][2])) {
                    const r = await translateSingleRobust(query, 'en', isConcise);
                    if (r) processedCSVRows[task.rowIndex][2] = task.prefix ? `${task.prefix}${r}` : r;
                }
                if (targetLangD !== 'zh-CN' && isBlankOrInvisible(processedCSVRows[task.rowIndex][3])) {
                    const r = await translateSingleRobust(query, targetLangD, isConcise);
                    if (r) processedCSVRows[task.rowIndex][3] = task.prefix ? `${task.prefix}${r}` : r;
                }
            }

            progressPercent.textContent = `100%`;
            progressBar.style.width = `100%`;

            clearInterval(timerInterval);
            const totalElapsed = ((performance.now() - startTime) / 1000).toFixed(1);
            statElapsedTime.textContent = `${totalElapsed}s`;

            statusText.textContent = "轉換完成";
            renderPreviewTable(processedCSVRows, targetLangDName);

            btnStart.disabled = false;
            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        });

        function renderPreviewTable(rows, targetLangDName = '簡體') {
            tableHeaderRow.innerHTML = '';
            tableBody.innerHTML = '';

            if (!rows || rows.length === 0) return;

            let maxCols = 0;
            rows.forEach(r => maxCols = Math.max(maxCols, r.length));
            maxCols = Math.max(maxCols, 4);

            for (let c = 0; c < maxCols; c++) {
                const colName = String.fromCharCode(65 + c);
                const th = document.createElement('th');
                th.className = "px-3.5 py-2.5 border-r border-slate-200 uppercase font-semibold text-[11px]";

                if (c === 1) {
                    th.innerHTML = `${colName} <span class="text-[10px] text-slate-400 font-normal block">繁體</span>`;
                } else if (c === 2) {
                    th.innerHTML = `${colName} <span class="text-[10px] text-slate-400 font-normal block">英文</span>`;
                } else if (c === 3) {
                    th.innerHTML = `${colName} <span class="text-[10px] text-slate-400 font-normal block">${targetLangDName}</span>`;
                } else {
                    th.textContent = colName;
                }
                tableHeaderRow.appendChild(th);
            }

            const previewLimit = Math.min(rows.length, 50);
            for (let r = 0; r < previewLimit; r++) {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";

                const rowData = rows[r];
                for (let c = 0; c < maxCols; c++) {
                    const td = document.createElement('td');
                    td.className = "px-3.5 py-2 border-r border-slate-100 truncate max-w-xs";
                    const cellVal = rowData[c] !== undefined ? String(rowData[c]) : '';

                    td.textContent = cellVal;
                    td.title = cellVal;
                    tr.appendChild(td);
                }
                tableBody.appendChild(tr);
            }
        }

        function generateCSVBlob(rows) {
            const csvString = Papa.unparse(rows);
            const bomCsv = '\uFEFF' + csvString;
            return new Blob([bomCsv], { type: 'text/csv;charset=utf-8;' });
        }

        btnDownload.addEventListener('click', () => {
            if (!processedCSVRows || processedCSVRows.length === 0) return;

            const blob = generateCSVBlob(processedCSVRows);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            let origName = currentFile ? currentFile.name.replace(/\.csv$/i, '') : 'export';
            a.download = `${origName}_converted.csv`;
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 60000);
            showToast('已開始下載 CSV');
        });

        btnRescueModal.addEventListener('click', () => {
            if (!processedCSVRows || processedCSVRows.length === 0) return;
            const csvText = Papa.unparse(processedCSVRows);
            rescueTextarea.value = '\uFEFF' + csvText;
            rescueModal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => {
            rescueModal.classList.add('hidden');
        });

        rescueModal.addEventListener('click', (e) => {
            if (e.target === rescueModal) rescueModal.classList.add('hidden');
        });

        btnCopyCSV.addEventListener('click', () => {
            const fullText = rescueTextarea.value;
            const textarea = document.createElement('textarea');
            textarea.value = fullText;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('已複製全部 CSV 內容');
            } catch (err) {
                showToast('複製失敗，請手動複製');
            }
            document.body.removeChild(textarea);
        });

        btnOpenNewTab.addEventListener('click', () => {
            if (!processedCSVRows || processedCSVRows.length === 0) return;
            const blob = generateCSVBlob(processedCSVRows);
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        });

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-5 right-5 px-3.5 py-2 rounded-lg bg-slate-900 text-white text-xs font-medium shadow-lg z-50 transition-all transform translate-y-2";
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => document.body.removeChild(toast), 250);
            }, 2500);
        }
    </script>
</body>
