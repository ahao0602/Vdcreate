<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加班時數統計表 (即時跨裝置共享・24H制)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.4rem center;
      background-size: 1em;
      padding-right: 1.5rem !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pb-6 mb-6 border-b border-slate-200">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <i data-lucide="clock" class="w-8 h-8 text-indigo-600"></i>
          加班時數統計表
          <span class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 ml-1">即時同步版</span>
        </h1>
        <p class="text-sm text-slate-500 mt-1">跨裝置即時同步 · 支援多段休息扣除 · 24小時制 · 支援CSV備份</p>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span id="sync-indicator" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-medium bg-slate-100 text-slate-600 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          連線準備中...
        </span>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <section class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-semibold text-slate-900 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
            登記工作時數
          </h2>
          <button type="button" onclick="recordNoOvertime()" class="px-2.5 py-1 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg flex items-center gap-1 transition shadow-sm" title="將當前人員與日期的加班時數登記為 0 小時">
            <i data-lucide="coffee" class="w-3.5 h-3.5"></i>
            今日無加班
          </button>
        </div>

        <div class="mb-4">
          <button type="button" id="applyLastUsedBtn" onclick="applyLastUsedTimes()" class="w-full py-2 px-3 bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-800 border border-amber-200 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition shadow-sm">
            <i data-lucide="history" class="w-4 h-4 text-amber-600"></i>
            <span id="lastUsedBtnLabel">帶入上次填寫的時間</span>
          </button>
        </div>

        <form id="overtime-form" class="space-y-4" onsubmit="handleSubmit(event)">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">姓名 / 工號</label>
            <input type="text" id="userName" required placeholder="例如：陳大明" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">登記日期</label>
            <input type="date" id="workDate" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-700">加班時段 (24H)</span>
              <button type="button" onclick="openPresetModal('work')" class="text-[11px] text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                管理常用
              </button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-medium text-slate-500 mb-1">起始時間</label>
                <div class="flex items-center gap-1 bg-white border border-slate-300 rounded-lg p-1 focus-within:ring-2 focus-within:ring-indigo-500">
                  <select id="startH" required class="w-1/2 bg-transparent text-sm font-mono text-center appearance-none focus:outline-none cursor-pointer"></select>
                  <span class="font-bold text-slate-400">:</span>
                  <select id="startM" required class="w-1/2 bg-transparent text-sm font-mono text-center appearance-none focus:outline-none cursor-pointer"></select>
                </div>
              </div>

              <div>
                <label class="block text-[11px] font-medium text-slate-500 mb-1">結束時間</label>
                <div class="flex items-center gap-1 bg-white border border-slate-300 rounded-lg p-1 focus-within:ring-2 focus-within:ring-indigo-500">
                  <select id="endH" required class="w-1/2 bg-transparent text-sm font-mono text-center appearance-none focus:outline-none cursor-pointer"></select>
                  <span class="font-bold text-slate-400">:</span>
                  <select id="endM" required class="w-1/2 bg-transparent text-sm font-mono text-center appearance-none focus:outline-none cursor-pointer"></select>
                </div>
              </div>
            </div>

            <div class="pt-1 flex flex-wrap items-center gap-1.5 text-[11px]" id="workPresetContainer"></div>
          </div>

          <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-700">休息時段扣除 (可多選)</span>
              <div class="flex items-center gap-2">
                <button type="button" onclick="openPresetModal('rest')" class="text-[11px] text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                  <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                  管理常用
                </button>
                <button type="button" onclick="clearAllRestTimes()" class="text-[11px] text-slate-400 hover:text-rose-500 font-medium">全清空</button>
              </div>
            </div>

            <div class="space-y-1">
              <div class="text-[11px] text-slate-500">點擊下方常用時段可直接疊加：</div>
              <div class="flex flex-wrap items-center gap-1.5 text-[11px]" id="restPresetContainer"></div>
            </div>

            <div id="restIntervalsList" class="space-y-2"></div>

            <button type="button" onclick="addRestInterval()" class="w-full py-1.5 px-2 bg-white hover:bg-slate-100 text-slate-700 border border-dashed border-slate-300 rounded-lg text-xs font-medium flex items-center justify-center gap-1 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5 text-slate-500"></i>
              增加一段休息時間
            </button>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">事由 / 備註 (選填)</label>
            <input type="text" id="note" placeholder="例如：假日機房維護、準時下班" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <div class="p-3.5 bg-indigo-50/80 border border-indigo-100 rounded-xl flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-indigo-950 flex items-center gap-1">
                本次計算時數
                <span id="crossDayBadge" class="hidden text-[10px] bg-indigo-200 text-indigo-800 px-1.5 py-0.2 rounded font-mono">跨日</span>
              </div>
              <div class="text-[11px] text-indigo-700 mt-0.5" id="calcBreakdown">請選擇時間自動試算</div>
            </div>
            <div class="text-2xl font-black text-indigo-600 font-mono tracking-tight" id="calculatedHours">0.0 <span class="text-xs font-normal text-indigo-500">小時</span></div>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-sm font-semibold rounded-xl shadow-sm transition flex items-center justify-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i>
            儲存加班紀錄
          </button>
        </form>
      </section>

      <section class="lg:col-span-2 space-y-6">
        
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs text-slate-500 font-medium">總計加班時數</div>
            <div class="text-xl sm:text-2xl font-black text-slate-900 mt-1 font-mono" id="stat-total-hours">0.0 <span class="text-xs font-normal text-slate-400">hr</span></div>
          </div>
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs text-slate-500 font-medium">加班登錄</div>
            <div class="text-xl sm:text-2xl font-black text-indigo-600 mt-1 font-mono" id="stat-count">0 <span class="text-xs font-normal text-slate-400">筆</span></div>
          </div>
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs text-slate-500 font-medium">無加班登記</div>
            <div class="text-xl sm:text-2xl font-black text-emerald-600 mt-1 font-mono" id="stat-no-ot-count">0 <span class="text-xs font-normal text-slate-400">天</span></div>
          </div>
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
            <div class="text-xs text-slate-500 font-medium">扣除休息總計</div>
            <div class="text-xl sm:text-2xl font-black text-slate-700 mt-1 font-mono" id="stat-rest-hours">0.0 <span class="text-xs font-normal text-slate-400">hr</span></div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
          <div class="px-5 py-3.5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50/50">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <i data-lucide="list" class="w-4 h-4 text-slate-500"></i>
              全員加班記錄清單 (即時同步)
            </h3>
            <div class="flex flex-wrap items-center gap-2">
              <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋姓名或備註..." class="px-2.5 py-1 text-xs border border-slate-200 rounded-lg bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 w-32 sm:w-44">
              
              <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleCSVFileSelect(event)">
              <button onclick="triggerCSVUpload()" title="載入外部或備份的 CSV 檔" class="px-2.5 py-1 text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg flex items-center gap-1 transition">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                載入 CSV
              </button>

              <button onclick="exportCSV()" title="匯出 CSV 檔" class="px-2.5 py-1 text-xs font-semibold bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-lg flex items-center gap-1 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                匯出 CSV
              </button>
            </div>
          </div>

          <div class="overflow-x-auto min-h-[320px]">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 text-slate-600 font-semibold border-b border-slate-200">
                  <th class="py-3 px-3">日期</th>
                  <th class="py-3 px-3">姓名</th>
                  <th class="py-3 px-3">加班區間 (24H)</th>
                  <th class="py-3 px-3">扣除休息時段</th>
                  <th class="py-3 px-3 font-bold text-indigo-700">實計時數</th>
                  <th class="py-3 px-3">狀態 / 備註</th>
                  <th class="py-3 px-3 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="records-tbody" class="divide-y divide-slate-100 font-normal">
                <tr>
                  <td colspan="7" class="py-12 text-center text-slate-400">資料讀取中...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>
    </div>
  </div>

  <div id="presetModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-200">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2" id="presetModalTitle">
          <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
          設定常用時間
        </h3>
        <button onclick="closePresetModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-5 space-y-4">
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold text-slate-600">現有快捷項目</span>
            <span class="text-[11px] text-indigo-600 font-medium bg-indigo-50 px-2 py-0.5 rounded">依時間先後排序</span>
          </div>
          <div id="presetItemsList" class="space-y-1.5 max-h-44 overflow-y-auto pr-1 text-xs"></div>
        </div>

        <div class="pt-3 border-t border-slate-100 space-y-2.5">
          <div class="text-xs font-semibold text-slate-700">新增常用時段</div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">標籤名稱 (選填，未填自動取時間)</label>
            <input type="text" id="newPresetLabel" placeholder="例如：假日午休 / 晚餐時段" class="w-full px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">起始時間 (24H)</label>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded-lg p-1">
                <select id="presetStartH" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none focus:outline-none"></select>
                <span class="font-bold text-slate-400">:</span>
                <select id="presetStartM" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none focus:outline-none"></select>
              </div>
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">結束時間 (24H)</label>
              <div class="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded-lg p-1">
                <select id="presetEndH" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none focus:outline-none"></select>
                <span class="font-bold text-slate-400">:</span>
                <select id="presetEndM" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none focus:outline-none"></select>
              </div>
            </div>
          </div>
          <button type="button" onclick="saveNewPreset()" class="w-full mt-2 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            加入並自動排序
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 px-4 py-2.5 rounded-xl shadow-xl bg-slate-900 text-white text-xs font-medium transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none flex items-center gap-2 z-50">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">操作完成</span>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // 專屬 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyB6PJuIGV4fuQadq7Xp5PSH-uZ4x2kpyec",
      authDomain: "workhours-aaf22.firebaseapp.com",
      projectId: "workhours-aaf22",
      storageBucket: "workhours-aaf22.firebasestorage.app",
      messagingSenderId: "963687453689",
      appId: "1:963687453689:web:34a8004811d4456f5b6328",
      measurementId: "G-20E5CCYE41"
    };

    let app, auth, db;
    let currentAuthUser = null;
    let isCloudActive = false;
    window.records = [];

    async function initAuth() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // 匿名驗證：免帳密即可即時存取與同步
        const cred = await signInAnonymously(auth);
        currentAuthUser = cred.user;
        isCloudActive = true;
        updateStatus('即時連線同步中 (多人共享)', 'emerald');
        listenToRecords();
      } catch (err) {
        console.error('Firebase 連線失敗:', err);
        isCloudActive = false;
        updateStatus('連線失敗 (本機暫存)', 'rose');
        window.renderTable();
      }
    }

    function updateStatus(text, color) {
      const el = document.getElementById('sync-indicator');
      if (!el) return;
      if (color === 'emerald') {
        el.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${text}`;
      } else if (color === 'amber') {
        el.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-medium bg-amber-50 text-amber-700 border border-amber-200';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> ${text}`;
      } else {
        el.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-medium bg-rose-50 text-rose-700 border border-rose-200';
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span> ${text}`;
      }
    }

    // 監聽加班紀錄集合
    function listenToRecords() {
      if (!currentAuthUser) return;
      const targetCol = collection(db, 'overtime_records');
      
      onSnapshot(targetCol, (snapshot) => {
        const list = [];
        snapshot.forEach(docSnap => {
          list.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        // 依照日期與時間降冪排列
        list.sort((a, b) => {
          const valA = `${a.workDate || ''} ${a.startTime || ''}`;
          const valB = `${b.workDate || ''} ${b.startTime || ''}`;
          return valB.localeCompare(valA);
        });
        window.records = list;

        // 自動捕捉最近一筆紀錄作為上次常用時段
        const latestWorkRecord = list.find(r => !r.isNoOvertime && r.startTime && r.startTime !== '-');
        if (latestWorkRecord && !window.hasManualLastUsed) {
          const rests = Array.isArray(latestWorkRecord.rests) 
            ? latestWorkRecord.rests 
            : (latestWorkRecord.restStart && latestWorkRecord.restEnd ? [{ start: latestWorkRecord.restStart, end: latestWorkRecord.restEnd }] : []);

          window.lastUsedTimes = {
            start: latestWorkRecord.startTime,
            end: latestWorkRecord.endTime,
            rests: rests,
            userName: latestWorkRecord.userName || ''
          };
          window.updateLastUsedUI();
        }

        window.renderTable();
      }, (err) => {
        console.error('Snapshot 讀取異常:', err);
        window.showToast('雲端讀取異常');
      });
    }

    // 新增資料
    window.addRecordToDB = async function(record) {
      if (isCloudActive && currentAuthUser) {
        const targetCol = collection(db, 'overtime_records');
        await addDoc(targetCol, {
          ...record,
          createdUserId: currentAuthUser.uid,
          createdAt: Date.now()
        });
      } else {
        record.id = 'loc_' + Date.now() + Math.random().toString(36).substring(2, 6);
        window.records.unshift(record);
        window.renderTable();
      }
    };

    // 刪除資料
    window.deleteRecordFromDB = async function(id) {
      if (!confirm('確定要刪除此筆紀錄嗎？')) return;

      if (isCloudActive && currentAuthUser) {
        try {
          const docRef = doc(db, 'overtime_records', id);
          await deleteDoc(docRef);
          window.showToast('已自雲端資料庫刪除');
        } catch (e) {
          window.showToast('刪除失敗');
        }
      } else {
        window.records = window.records.filter(r => r.id !== id);
        window.renderTable();
        window.showToast('已自本機移除');
      }
    };

    initAuth();
  </script>

  <script>
    const DEFAULT_WORK_PRESETS = [
      { id: 'w0', label: '08:00~17:00 (早班)', start: '08:00', end: '17:00' },
      { id: 'w1', label: '08:00~21:00 (假日全天)', start: '08:00', end: '21:00' },
      { id: 'w2', label: '18:00~21:00 (晚班)', start: '18:00', end: '21:00' },
      { id: 'w3', label: '18:00~22:00', start: '18:00', end: '22:00' }
    ];

    const DEFAULT_REST_PRESETS = [
      { id: 'r1', label: '中午 12:00~13:00 (1h)', start: '12:00', end: '13:00' },
      { id: 'r2', label: '下午 17:00~17:30 (30分)', start: '17:00', end: '17:30' },
      { id: 'r3', label: '晚餐 18:00~18:30 (30分)', start: '18:00', end: '18:30' },
      { id: 'r4', label: '晚餐 18:00~19:00 (1h)', start: '18:00', end: '19:00' }
    ];

    let currentWorkPresets = [...DEFAULT_WORK_PRESETS];
    let currentRestPresets = [...DEFAULT_REST_PRESETS];
    let currentModalType = 'work';
    let activeRestList = [];

    window.lastUsedTimes = {
      start: '08:00',
      end: '21:00',
      rests: [
        { start: '12:00', end: '13:00' },
        { start: '18:00', end: '18:30' }
      ],
      userName: ''
    };
    window.hasManualLastUsed = false;

    function sortPresetsChronologically(list) {
      return list.sort((a, b) => {
        if (a.start === b.start) return a.end.localeCompare(b.end);
        return a.start.localeCompare(b.start);
      });
    }

    function createTimeOptions(type) {
      let html = `<option value="">${type === 'H' ? '時' : '分'}</option>`;
      const max = type === 'H' ? 24 : 60;
      for (let i = 0; i < max; i++) {
        const val = i.toString().padStart(2, '0');
        html += `<option value="${val}">${val}</option>`;
      }
      return html;
    }

    function populateFixed24HourSelects() {
      ['startH', 'endH', 'presetStartH', 'presetEndH'].forEach(id => {
        document.getElementById(id).innerHTML = createTimeOptions('H');
      });
      ['startM', 'endM', 'presetStartM', 'presetEndM'].forEach(id => {
        document.getElementById(id).innerHTML = createTimeOptions('M');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      populateFixed24HourSelects();
      document.getElementById('workDate').value = new Date().toISOString().split('T')[0];

      sortPresetsChronologically(currentWorkPresets);
      sortPresetsChronologically(currentRestPresets);

      setOvertimeValues('08:00', '21:00');
      addRestInterval('12:00', '13:00');

      ['startH', 'startM', 'endH', 'endM'].forEach(id => {
        document.getElementById(id).addEventListener('change', calculateCurrentInput);
      });

      renderPresetButtons();
      window.updateLastUsedUI();
      calculateCurrentInput();
      lucide.createIcons();
    });

    function addRestInterval(defaultStart = '', defaultEnd = '') {
      const restId = 'rest_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
      const [sh, sm] = defaultStart ? defaultStart.split(':') : ['', ''];
      const [eh, em] = defaultEnd ? defaultEnd.split(':') : ['', ''];

      const item = { id: restId, startH: sh, startM: sm, endH: eh, endM: em };
      activeRestList.push(item);
      renderRestIntervalsList();
      calculateCurrentInput();
    }

    function removeRestInterval(id) {
      activeRestList = activeRestList.filter(item => item.id !== id);
      renderRestIntervalsList();
      calculateCurrentInput();
    }

    function clearAllRestTimes() {
      activeRestList = [];
      renderRestIntervalsList();
      calculateCurrentInput();
    }

    function appendRestPreset(start, end) {
      addRestInterval(start, end);
      window.showToast(`已疊加休息時段 (${start} ~ ${end})`);
    }

    function renderRestIntervalsList() {
      const container = document.getElementById('restIntervalsList');
      if (activeRestList.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-slate-400 py-1 italic">未設定休息時段 (不扣除休息)</div>`;
        return;
      }

      container.innerHTML = activeRestList.map((item, index) => {
        return `
          <div class="flex items-center gap-1.5 bg-white p-1.5 border border-slate-200 rounded-lg shadow-2xs">
            <span class="text-[11px] font-mono font-bold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">#${index + 1}</span>
            <div class="flex items-center gap-1 flex-1">
              <select onchange="updateRestValue('${item.id}', 'startH', this.value)" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none border border-slate-200 rounded py-1 focus:outline-none">
                ${createTimeOptionsWithSelected('H', item.startH)}
              </select>
              <span class="text-slate-400 font-bold">:</span>
              <select onchange="updateRestValue('${item.id}', 'startM', this.value)" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none border border-slate-200 rounded py-1 focus:outline-none">
                ${createTimeOptionsWithSelected('M', item.startM)}
              </select>
            </div>
            <span class="text-slate-400 font-bold text-xs">~</span>
            <div class="flex items-center gap-1 flex-1">
              <select onchange="updateRestValue('${item.id}', 'endH', this.value)" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none border border-slate-200 rounded py-1 focus:outline-none">
                ${createTimeOptionsWithSelected('H', item.endH)}
              </select>
              <span class="text-slate-400 font-bold">:</span>
              <select onchange="updateRestValue('${item.id}', 'endM', this.value)" class="w-1/2 bg-transparent text-xs font-mono text-center appearance-none border border-slate-200 rounded py-1 focus:outline-none">
                ${createTimeOptionsWithSelected('M', item.endM)}
              </select>
            </div>
            <button type="button" onclick="removeRestInterval('${item.id}')" class="p-1 text-slate-400 hover:text-rose-500 rounded transition" title="移除此段休息">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function createTimeOptionsWithSelected(type, selectedVal) {
      let html = `<option value="">${type === 'H' ? '時' : '分'}</option>`;
      const max = type === 'H' ? 24 : 60;
      for (let i = 0; i < max; i++) {
        const val = i.toString().padStart(2, '0');
        const isSel = (val === selectedVal) ? 'selected' : '';
        html += `<option value="${val}" ${isSel}>${val}</option>`;
      }
      return html;
    }

    function updateRestValue(id, field, val) {
      const target = activeRestList.find(item => item.id === id);
      if (target) {
        target[field] = val;
        calculateCurrentInput();
      }
    }

    function renderPresetButtons() {
      const workBox = document.getElementById('workPresetContainer');
      const restBox = document.getElementById('restPresetContainer');

      sortPresetsChronologically(currentWorkPresets);
      sortPresetsChronologically(currentRestPresets);

      workBox.innerHTML = `<span class="text-slate-400">常用：</span>` + currentWorkPresets.map(p => `
        <button type="button" onclick="setOvertimeValues('${p.start}', '${p.end}')" class="px-2 py-0.5 bg-white border border-slate-200 hover:border-indigo-400 hover:text-indigo-600 rounded text-slate-600 transition truncate max-w-[130px]" title="${p.start} ~ ${p.end}">
          ${escapeHTML(p.label)}
        </button>
      `).join('');

      restBox.innerHTML = currentRestPresets.map(p => `
        <button type="button" onclick="appendRestPreset('${p.start}', '${p.end}')" class="px-2 py-0.5 bg-white border border-slate-200 hover:border-amber-400 hover:text-amber-700 rounded text-slate-600 transition truncate max-w-[130px] flex items-center gap-1" title="點擊加此休息時段: ${p.start} ~ ${p.end}">
          <i data-lucide="plus" class="w-3 h-3 text-amber-500"></i>
          ${escapeHTML(p.label)}
        </button>
      `).join('');

      lucide.createIcons();
    }

    function setOvertimeValues(start, end) {
      const [sh, sm] = start.split(':');
      const [eh, em] = end.split(':');
      document.getElementById('startH').value = sh;
      document.getElementById('startM').value = sm;
      document.getElementById('endH').value = eh;
      document.getElementById('endM').value = em;
      calculateCurrentInput();
    }

    function getTimeValue(hId, mId) {
      const h = document.getElementById(hId).value;
      const m = document.getElementById(mId).value;
      if (h === '' || m === '') return null;
      return `${h}:${m}`;
    }

    function calculateDurationMinutes(startStr, endStr) {
      if (!startStr || !endStr) return { minutes: 0, isCrossDay: false };
      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      const startTotal = sh * 60 + sm;
      const endTotal = eh * 60 + em;

      let diff = endTotal - startTotal;
      let isCrossDay = false;
      if (diff < 0) {
        diff += 24 * 60;
        isCrossDay = true;
      }
      return { minutes: diff, isCrossDay };
    }

    function computeOvertimeWithMultiRests(startTime, endTime, restsArray) {
      if (!startTime || !endTime) {
        return { totalWork: 0, restDeduct: 0, netHours: 0, isCrossDay: false, validRests: [] };
      }

      const work = calculateDurationMinutes(startTime, endTime);
      let totalRestMinutes = 0;
      const validRests = [];

      restsArray.forEach(r => {
        if (r.startH && r.startM && r.endH && r.endM) {
          const s = `${r.startH}:${r.startM}`;
          const e = `${r.endH}:${r.endM}`;
          const dur = calculateDurationMinutes(s, e);
          totalRestMinutes += dur.minutes;
          validRests.push({ start: s, end: e, minutes: dur.minutes });
        }
      });

      const netMinutes = Math.max(0, work.minutes - totalRestMinutes);
      return {
        totalWork: +(work.minutes / 60).toFixed(2),
        restDeduct: +(totalRestMinutes / 60).toFixed(2),
        netHours: +(netMinutes / 60).toFixed(2),
        isCrossDay: work.isCrossDay,
        validRests
      };
    }

    function calculateCurrentInput() {
      const s = getTimeValue('startH', 'startM');
      const e = getTimeValue('endH', 'endM');
      const badge = document.getElementById('crossDayBadge');

      if (!s || !e) {
        document.getElementById('calculatedHours').innerHTML = `0.0 <span class="text-xs font-normal text-indigo-500">小時</span>`;
        document.getElementById('calcBreakdown').innerText = '請選擇起始與結束時間';
        badge.classList.add('hidden');
        return;
      }

      const res = computeOvertimeWithMultiRests(s, e, activeRestList);
      document.getElementById('calculatedHours').innerHTML = `${res.netHours} <span class="text-xs font-normal text-indigo-500">小時</span>`;

      if (res.isCrossDay) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      let breakdown = `工時 ${res.totalWork}h (${s} ~ ${e})`;
      if (res.restDeduct > 0) {
        breakdown += ` - 扣除 ${res.validRests.length} 次休息共 ${res.restDeduct}h`;
      }
      document.getElementById('calcBreakdown').innerText = breakdown;
    }

    window.updateLastUsedUI = function() {
      const labelEl = document.getElementById('lastUsedBtnLabel');
      if (!labelEl) return;
      if (window.lastUsedTimes && window.lastUsedTimes.start && window.lastUsedTimes.end) {
        const restsCount = (window.lastUsedTimes.rests || []).length;
        let text = `套用上次：${window.lastUsedTimes.start}~${window.lastUsedTimes.end}`;
        if (restsCount > 0) text += ` (含 ${restsCount} 次休息)`;
        labelEl.textContent = text;
      } else {
        labelEl.textContent = '帶入上次填寫的時間';
      }
    };

    window.applyLastUsedTimes = function() {
      if (!window.lastUsedTimes || !window.lastUsedTimes.start || !window.lastUsedTimes.end) {
        window.showToast('尚未有已記錄的上次時間');
        return;
      }

      setOvertimeValues(window.lastUsedTimes.start, window.lastUsedTimes.end);

      activeRestList = [];
      if (Array.isArray(window.lastUsedTimes.rests) && window.lastUsedTimes.rests.length > 0) {
        window.lastUsedTimes.rests.forEach(r => {
          addRestInterval(r.start, r.end);
        });
      } else {
        renderRestIntervalsList();
      }

      const userNameInput = document.getElementById('userName');
      if (!userNameInput.value.trim() && window.lastUsedTimes.userName) {
        userNameInput.value = window.lastUsedTimes.userName;
      }

      calculateCurrentInput();
      window.showToast(`已套用上次時段 (${window.lastUsedTimes.start} ~ ${window.lastUsedTimes.end})`);
    };

    async function recordNoOvertime() {
      const userName = document.getElementById('userName').value.trim();
      const workDate = document.getElementById('workDate').value;
      const customNote = document.getElementById('note').value.trim();

      if (!userName) {
        window.showToast('請先填寫姓名或工號');
        document.getElementById('userName').focus();
        return;
      }

      if (!workDate) {
        window.showToast('請先選取日期');
        return;
      }

      const newRecord = {
        userName,
        workDate,
        startTime: '-',
        endTime: '-',
        rests: [],
        netHours: 0,
        restDeduct: 0,
        totalWork: 0,
        isCrossDay: false,
        isNoOvertime: true,
        note: customNote || '今日無加班 (正常工時/準時下班)'
      };

      try {
        await window.addRecordToDB(newRecord);
        window.showToast(`已登記【${userName}】${workDate} 今日無加班`);
        document.getElementById('note').value = '';
      } catch (e) {
        window.showToast('登記失敗，請重試');
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const userName = document.getElementById('userName').value.trim();
      const workDate = document.getElementById('workDate').value;
      const startTime = getTimeValue('startH', 'startM');
      const endTime = getTimeValue('endH', 'endM');
      const note = document.getElementById('note').value.trim();

      if (!startTime || !endTime) {
        window.showToast('請完整選擇加班起始與結束時間');
        return;
      }

      const { netHours, restDeduct, totalWork, isCrossDay, validRests } = computeOvertimeWithMultiRests(startTime, endTime, activeRestList);

      if (netHours <= 0) {
        window.showToast('扣除休息後時數小於等於 0，若當日無加班可點擊上方按鈕');
        return;
      }

      const newRecord = {
        userName,
        workDate,
        startTime,
        endTime,
        rests: validRests.map(r => ({ start: r.start, end: r.end })),
        netHours,
        restDeduct,
        totalWork,
        isCrossDay,
        isNoOvertime: false,
        note
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 儲存中...`;
      lucide.createIcons();

      try {
        await window.addRecordToDB(newRecord);

        window.lastUsedTimes = {
          start: startTime,
          end: endTime,
          rests: validRests.map(r => ({ start: r.start, end: r.end })),
          userName: userName
        };
        window.hasManualLastUsed = true;
        window.updateLastUsedUI();

        window.showToast('加班紀錄已成功儲存！');
        document.getElementById('note').value = '';
        calculateCurrentInput();
      } catch (e) {
        window.showToast('儲存失敗，請重試');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="save" class="w-4 h-4"></i> 儲存加班紀錄`;
        lucide.createIcons();
      }
    }

    function openPresetModal(type) {
      currentModalType = type;
      const modal = document.getElementById('presetModal');
      const title = document.getElementById('presetModalTitle');
      title.innerHTML = `<i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i> 設定常用${type === 'work' ? '加班' : '休息'}時間`;
      
      document.getElementById('newPresetLabel').value = '';
      document.getElementById('presetStartH').value = type === 'work' ? '08' : '12';
      document.getElementById('presetStartM').value = '00';
      document.getElementById('presetEndH').value = type === 'work' ? '17' : '13';
      document.getElementById('presetEndM').value = '00';

      renderModalPresetList();
      modal.classList.remove('hidden');
      lucide.createIcons();
    }

    function closePresetModal() {
      document.getElementById('presetModal').classList.add('hidden');
    }

    function renderModalPresetList() {
      const listEl = document.getElementById('presetItemsList');
      const presets = currentModalType === 'work' ? currentWorkPresets : currentRestPresets;

      sortPresetsChronologically(presets);

      if (presets.length === 0) {
        listEl.innerHTML = `<div class="text-slate-400 py-3 text-center">尚未新增任何常用時段</div>`;
        return;
      }

      listEl.innerHTML = presets.map((p, idx) => `
        <div class="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded-lg">
          <div class="flex items-center gap-2">
            <span class="font-mono text-xs font-bold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">${p.start} ~ ${p.end}</span>
            <span class="font-medium text-slate-800">${escapeHTML(p.label)}</span>
          </div>
          <button type="button" onclick="deletePreset(${idx})" class="text-slate-400 hover:text-rose-600 p-1 transition" title="移除此項">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function saveNewPreset() {
      const labelInput = document.getElementById('newPresetLabel').value.trim();
      const sh = document.getElementById('presetStartH').value;
      const sm = document.getElementById('presetStartM').value;
      const eh = document.getElementById('presetEndH').value;
      const em = document.getElementById('presetEndM').value;

      if (!sh || !sm || !eh || !em) {
        window.showToast('請完整選取起訖時與分');
        return;
      }

      const start = `${sh}:${sm}`;
      const end = `${eh}:${em}`;
      const label = labelInput || `${start}~${end}`;
      const newP = { id: 'p_' + Date.now(), label, start, end };

      if (currentModalType === 'work') {
        currentWorkPresets.push(newP);
        sortPresetsChronologically(currentWorkPresets);
      } else {
        currentRestPresets.push(newP);
        sortPresetsChronologically(currentRestPresets);
      }

      renderModalPresetList();
      renderPresetButtons();
      document.getElementById('newPresetLabel').value = '';
      window.showToast('常用項目已新增並依時序排序');
    }

    function deletePreset(index) {
      if (currentModalType === 'work') {
        currentWorkPresets.splice(index, 1);
      } else {
        currentRestPresets.splice(index, 1);
      }
      renderModalPresetList();
      renderPresetButtons();
      window.showToast('常用項目已移除');
    }

    window.renderTable = function() {
      const tbody = document.getElementById('records-tbody');
      const search = (document.getElementById('searchInput')?.value || '').toLowerCase();

      const filtered = (window.records || []).filter(r => {
        if (!search) return true;
        return (r.userName && r.userName.toLowerCase().includes(search)) ||
               (r.note && r.note.toLowerCase().includes(search)) ||
               (r.workDate && r.workDate.includes(search));
      });

      let totalH = 0;
      let totalRest = 0;
      let otCount = 0;
      let noOtCount = 0;

      filtered.forEach(r => {
        if (r.isNoOvertime) {
          noOtCount++;
        } else {
          otCount++;
          totalH += Number(r.netHours) || 0;
          totalRest += Number(r.restDeduct) || 0;
        }
      });

      document.getElementById('stat-total-hours').innerHTML = `${totalH.toFixed(1)} <span class="text-xs font-normal text-slate-400">hr</span>`;
      document.getElementById('stat-count').innerHTML = `${otCount} <span class="text-xs font-normal text-slate-400">筆</span>`;
      document.getElementById('stat-no-ot-count').innerHTML = `${noOtCount} <span class="text-xs font-normal text-slate-400">天</span>`;
      document.getElementById('stat-rest-hours').innerHTML = `${totalRest.toFixed(1)} <span class="text-xs font-normal text-slate-400">hr</span>`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="py-12 text-center text-slate-400">
              <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
              尚無工作紀錄，可由左側登錄或點擊上方「載入 CSV」
            </td>
          </tr>
        `;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        if (item.isNoOvertime) {
          return `
            <tr class="hover:bg-slate-50 transition-colors bg-emerald-50/20">
              <td class="py-3 px-3 font-mono font-medium text-slate-700 whitespace-nowrap">${item.workDate || '-'}</td>
              <td class="py-3 px-3 font-semibold text-slate-900 whitespace-nowrap">${escapeHTML(item.userName)}</td>
              <td class="py-3 px-3 whitespace-nowrap text-slate-400 font-mono">-</td>
              <td class="py-3 px-3 whitespace-nowrap text-slate-400 font-mono">-</td>
              <td class="py-3 px-3 whitespace-nowrap">
                <span class="inline-flex items-center gap-1 font-semibold text-emerald-700 bg-emerald-100/70 px-2 py-0.5 rounded text-[11px]">
                  <i data-lucide="coffee" class="w-3 h-3"></i> 0 hr (無加班)
                </span>
              </td>
              <td class="py-3 px-3 text-slate-500 max-w-[150px] truncate" title="${escapeHTML(item.note || '')}">${escapeHTML(item.note || '今日無加班')}</td>
              <td class="py-3 px-3 text-right whitespace-nowrap">
                <button onclick="window.deleteRecordFromDB('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="刪除">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </td>
            </tr>
          `;
        }

        let restBadges = `<span class="text-slate-400 font-mono">-</span>`;
        const rests = Array.isArray(item.rests) ? item.rests : (item.restStart && item.restEnd ? [{ start: item.restStart, end: item.restEnd }] : []);

        if (rests.length > 0) {
          restBadges = `<div class="flex flex-wrap gap-1 max-w-[200px]">` + rests.map(r => `
            <span class="inline-flex items-center font-mono text-[11px] text-amber-800 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">
              ${r.start}~${r.end}
            </span>
          `).join('') + `<span class="text-[11px] text-amber-700 font-medium self-center">(-${item.restDeduct}h)</span></div>`;
        }

        const crossTag = item.isCrossDay ? `<span class="ml-1 text-[10px] bg-slate-200 text-slate-700 px-1 py-0.2 rounded font-sans">跨日</span>` : '';

        return `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 px-3 font-mono font-medium text-slate-700 whitespace-nowrap">${item.workDate || '-'}</td>
            <td class="py-3 px-3 font-semibold text-slate-900 whitespace-nowrap">${escapeHTML(item.userName)}</td>
            <td class="py-3 px-3 font-mono text-slate-700 whitespace-nowrap">${item.startTime} ~ ${item.endTime}${crossTag}</td>
            <td class="py-3 px-3 whitespace-nowrap">${restBadges}</td>
            <td class="py-3 px-3 font-mono font-bold text-indigo-600 text-sm whitespace-nowrap">${item.netHours} hr</td>
            <td class="py-3 px-3 text-slate-500 max-w-[150px] truncate" title="${escapeHTML(item.note || '')}">${escapeHTML(item.note || '-')}</td>
            <td class="py-3 px-3 text-right whitespace-nowrap">
              <button onclick="window.deleteRecordFromDB('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="刪除">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    };

    function triggerCSVUpload() {
      const fileInput = document.getElementById('csvFileInput');
      fileInput.value = '';
      fileInput.click();
    }

    function parseCSVLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function handleCSVFileSelect(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const text = e.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim().length > 0);
          if (lines.length <= 1) {
            window.showToast('CSV 檔案為空或無有效資料列');
            return;
          }

          let successCount = 0;
          for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 2) continue;

            const workDate = cols[0]?.trim() || '';
            const userName = cols[1]?.trim() || '';
            const startTime = cols[2]?.trim() || '-';
            const endTime = cols[3]?.trim() || '-';
            const restStr = cols[4]?.trim() || '';
            const restDeduct = parseFloat(cols[5]) || 0;
            const netHours = parseFloat(cols[6]) || 0;
            const isNoOvertime = cols[7]?.trim() === '是' || (netHours === 0 && (startTime === '-' || !startTime));
            const note = cols[8]?.trim() || '';

            if (!workDate || !userName) continue;

            const rests = [];
            if (restStr && restStr !== '-') {
              const segments = restStr.split(/;|；/);
              segments.forEach(seg => {
                const parts = seg.trim().split(/-|~/);
                if (parts.length === 2 && parts[0].includes(':') && parts[1].includes(':')) {
                  rests.push({ start: parts[0].trim(), end: parts[1].trim() });
                }
              });
            }

            const isCrossDay = calculateDurationMinutes(startTime, endTime).isCrossDay;

            const record = {
              workDate,
              userName,
              startTime: isNoOvertime ? '-' : startTime,
              endTime: isNoOvertime ? '-' : endTime,
              rests,
              restDeduct,
              netHours,
              totalWork: +(netHours + restDeduct).toFixed(2),
              isCrossDay,
              isNoOvertime,
              note
            };

            await window.addRecordToDB(record);
            successCount++;
          }

          window.showToast(`成功載入並同步 ${successCount} 筆資料`);
        } catch (err) {
          console.error('CSV 解析錯誤:', err);
          window.showToast('CSV 格式解析失敗，請確認檔案格式');
        }
      };

      reader.readAsText(file, 'utf-8');
    }

    function exportCSV() {
      const data = window.records || [];
      if (data.length === 0) {
        window.showToast('目前尚無資料可匯出');
        return;
      }

      let csv = "\uFEFF日期,姓名,加班起始(24H),加班結束(24H),休息時段明細,扣除總時數(h),實計時數(h),無加班標記,備註\n";
      data.forEach(r => {
        const rests = Array.isArray(r.rests) ? r.rests : (r.restStart && r.restEnd ? [{ start: r.restStart, end: r.restEnd }] : []);
        const restStr = rests.map(x => `${x.start}-${x.end}`).join('; ');
        csv += `"${r.workDate}","${r.userName}","${r.startTime || ''}","${r.endTime || ''}","${restStr}","${r.restDeduct || 0}","${r.netHours || 0}","${r.isNoOvertime ? '是' : '否'}","${(r.note || '').replace(/"/g, '""')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `加班統計_跨裝置同步備份_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      window.showToast('CSV 匯出成功');
    }

    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-message');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
      }, 2500);
    };

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
